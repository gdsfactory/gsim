name: Test
on:
  pull_request:
  push:
    branches:
    - main
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    permissions:
      contents: read
    steps:
    - name: Checkout repo
      uses: actions/checkout@v6
    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: bash .github/scripts/install-system-deps.sh libglu1-mesa libegl1 libgl1 libxrender1 libxcursor1 libxft2 libxinerama1
    - name: Install UV
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        prune-cache: true
    - name: Create environment
      run: uv sync --dev --all-extras
    - name: Run tests
      run: uv run pytest
    - name: Run RF calibration tests
      env:
        UV_PROJECT_ENVIRONMENT: .venv-rf-analysis
      run: uv run --locked --no-default-groups --group rf-analysis pytest tests/palace/test_transmission_guide.py
  test_coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Checkout repo
      uses: actions/checkout@v6
    - name: Install system dependencies
      run: bash .github/scripts/install-system-deps.sh libglu1-mesa libegl1 libgl1 libxrender1 libxcursor1 libxft2 libxinerama1
    - name: Install UV
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        prune-cache: true
    - name: Install Just
      uses: taiki-e/install-action@just
    - name: Create environment
      run: uv sync --dev --all-extras
    - name: Run tests with coverage
      run: just cov
    - name: Run RF calibration tests with coverage
      env:
        UV_PROJECT_ENVIRONMENT: .venv-rf-analysis
      run: >-
        uv run --locked --no-default-groups --group rf-analysis pytest tests/palace/test_transmission_guide.py --cov=gsim --cov-append --cov-report=term-missing:skip-covered --cov-report=xml
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v6
      with:
        use_oidc: true
        fail_ci_if_error: true
  release_version:
    name: Publish a version bump
    needs: [test, test_coverage]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release-version-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Tag and publish a version bump
      env:
        GH_TOKEN: ${{ github.token }}
        BEFORE_SHA: ${{ github.event.before }}
        AFTER_SHA: ${{ github.sha }}
      run: >-
        python scripts/release_version.py --before "$BEFORE_SHA" --after "$AFTER_SHA" --repository "$GITHUB_REPOSITORY"
