name: TCAD Local Tests
# The tcad_local tests run a real DEVSIM solve. The tcad extra brings DEVSIM
# its BLAS/LAPACK through scipy-openblas32, so a plain `uv sync` is enough on
# every runner OS (macos-latest is macOS 15+, which DEVSIM's macOS wheel
# needs): this is the check that a pip install of gsim[tcad] still solves.
# The gsim.tcad solves take well under a minute.
on:
  workflow_dispatch:
  push:
    branches:
    - main
  pull_request:
    paths:
    - src/gsim/common/**
    - src/gsim/tcad/**
    - tests/_helpers.py
    - tests/tcad/**
    - pyproject.toml
    - .github/workflows/test_tcad_local.yml
jobs:
  devsim:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    permissions:
      contents: read
    steps:
    - name: Checkout repo
      uses: actions/checkout@v6
    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libegl1 libgl1 libxrender1 libxcursor1 libxft2 libxinerama1
    - name: Install UV
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        prune-cache: true
    - name: Create environment
      run: uv sync --dev --all-extras
    - name: Run DEVSIM tests
      run: uv run pytest tests/tcad -m tcad_local
