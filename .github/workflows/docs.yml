name: Single uncached MEEP notebook
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  NOTEBOOK: nbs/meep_2d.ipynb
  PLOTLY_RENDERER: notebook_connected
  PYVISTA_JUPYTER_BACKEND: static
  PYVISTA_OFF_SCREEN: "true"
jobs:
  meep-2d:
    name: Run meep_2d without simulation cache
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout repo
      uses: actions/checkout@v6
    - name: Install system dependencies
      run: >-
        sudo apt-get update && sudo apt-get install -y libglu1-mesa libegl1 libgl1 libosmesa6 libxrender1 libxcursor1 libxft2 libxinerama1 xvfb
    - name: Install UV
      uses: astral-sh/setup-uv@v6
    - name: Create environment
      run: |
        uv sync --no-default-groups --group docs
        uv pip check
        uv run --no-sync python -m ipykernel install --user --name gsim --display-name gsim
    - name: Disable simulation cache in the runner's notebook copy
      run: |
        uv run --no-sync python - <<'PY'
        import json
        import os
        from pathlib import Path

        notebook_path = Path(os.environ["NOTEBOOK"])
        notebook = json.loads(notebook_path.read_text())
        cached_call = "sim.run(check_cache=True)"
        uncached_call = "sim.run(check_cache=False)"
        replaced_calls = 0
        for cell in notebook["cells"]:
            if cell["cell_type"] != "code":
                continue
            source = "".join(cell["source"])
            replaced_calls += source.count(cached_call)
            cell["source"] = source.replace(cached_call, uncached_call).splitlines(keepends=True)
        if replaced_calls != 1:
            raise SystemExit(f"Expected one simulation call, found {replaced_calls}")
        notebook_path.write_text(json.dumps(notebook, indent=1) + "\n")
        print("Disabled simulation cache for exactly one MEEP simulation call.")
        PY
    - name: Execute the single notebook
      env:
        GFP_API_KEY: ${{ secrets.GFP_API_KEY }}
      run: uv run --no-sync papermill "$NOTEBOOK" "$RUNNER_TEMP/meep_2d.executed.ipynb" -k gsim
    - name: Upload executed notebook
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: meep-2d-uncached
        path: ${{ runner.temp }}/meep_2d.executed.ipynb
        retention-days: 1
