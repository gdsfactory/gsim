[project]
name = "gsim"
version = "0.4.0"
description = "Electromagnetic simulation for photonics and electronics, powered by GDSFactory."
readme = "README.md"
requires-python = "~=3.12.0"
license = { text = "Apache-2.0" }
authors = [{ name = "GDSFactory", email = "contact@gdsfactory.com" }]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12"
]
dependencies = [
  "gdsfactory>=9,<10",
  "gdsfactoryplus>=1.8.20,<3",
  "gmsh",
  "meshio>=5.0.0",
  "nbformat>=4.2.0",
  "nest_asyncio2",
  "pdk-schema==0.0.2",
  "plotly",
  "pyvista>=0.43.0",
  "trame",
  "trame-vtk",
  "trame-vuetify",
]

[project.optional-dependencies]
# Interactive 3-D visualization (PyVista + trame server rendering) with the
# extra packages needed for reliable headless and notebook use.
visualize = [
  "jupyter-server-proxy>=4.1.0",
  "nest-asyncio",
  "pyvirtualdisplay>=3.0.0",
  "trame>=3.6.0,<4",
  "trame-client>=3.6.0,<4",
  "trame-server>=3.6.0,<4",
  "trame-vtk>=2.8.0,<3",
  "trame-vuetify>=2.7.0,<3",
]

[dependency-groups]
dev = [
  "build>=1.2.0",
  "towncrier>=24.0.0",
  { include-group = "docs" },
  { include-group = "lint" },
  { include-group = "test" }
]
docs = [
  "altair>=5.5.0",
  "griffe>=1.5.6",
  "ipykernel>=6.29.5",
  "matplotlib>=3.10.0",
  "mkdocstrings[python]>=0.27.0",
  "nb-clean>=4.0.1",
  "nbconvert>=7.16.6",
  "nbstripout>=0.8.1",
  "papermill>=2.6.0",
  "plotly>=6.0.0",
  "vega-datasets>=0.9.0",
  "zensical>=0.0.46"
]
lint = [
  "mkinit>=1.1.0",
  "mypy>=1.15.0",
  "pre-commit>=4.1.0",
  "pyright>=1.1.0",
  "ruff>=0.9.0",
  "ty>=0.0.25"
]
palace-inductor = [
  "circulax==0.2.3",
  "ihp-gdsfactory==0.2.8",
  "klujax==0.5.0",
]
test = [
  "ihp-gdsfactory>=0.2.8",
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "pytest-randomly>=3.16.0",
  "pytest-regressions>=2.5.0",
  "pytest-xdist>=3.6.0",
]

[build-system]
requires = ["build", "setuptools>=61", "uv", "wheel"]
build-backend = "setuptools.build_meta"

[tool.codespell]
ignore-words-list = "doubleclick,euclidian,sie,te"

[tool.interrogate]
docstring-style = "google"
exclude = ["docs/**/*", "tests/**/*", "nbs/**/*"]
ext = []
fail-under = 100
ignore-nested-classes = true
ignore-nested-functions = true
ignore-overloaded-functions = true
ignore-regex = ["^test_.*"]
omit-covered-files = true
verbose = 2

[tool.mypy]
mypy_path = ["src"]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
implicit_reexport = true
module = "gsim"

[[tool.mypy.overrides]]
check_untyped_defs = false
disable_error_code = [
  "no-untyped-def",
  "no-untyped-call",
  "var-annotated",
  "assignment"
]
disallow_any_generics = false
disallow_untyped_defs = false
# The Palace subpackage is still evolving and uses optional dependencies
# (e.g., gmsh, plotly). Keep mypy strict overall, but relax it here so
# contributors aren't blocked by large refactors during early development.
module = "gsim.palace.*"
warn_return_any = false

[[tool.mypy.overrides]]
check_untyped_defs = false
disable_error_code = [
  "no-untyped-def",
  "no-untyped-call",
  "var-annotated",
  "assignment"
]
disallow_any_generics = false
disallow_untyped_defs = false
# The MEEP subpackage wraps cloud-only MEEP simulation. Relaxed mypy
# to match the Palace approach during early development.
module = "gsim.meep.*"
warn_return_any = false

[[tool.mypy.overrides]]
ignore_errors = true
module = "tests.*"

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = "gmsh"

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = "gmsh.*"

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = "plotly"

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = "plotly.*"

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = "palacetoolkit_palace_cpu"

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = "palacetoolkit_palace_cpu.*"

[tool.pylsp-mypy]
enabled = true
live_mode = true
strict = true

[tool.pyright]
exclude = ["tests", "**/__pycache__", "**/.venv"]
include = ["src"]
pythonVersion = "3.12"
reportMissingImports = "none"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
addopts = "--tb=short -m 'not cloud and not meep_local'"
markers = [
  "cloud: tests that submit jobs to GDSFactory+ cloud servers (deselected by default; run with `pytest -m cloud`)",
  "sim_smoke_test: smallest cloud sims (one per solver) run automatically per-PR; run with `pytest -m sim_smoke_test`",
  "meep_local: tests requiring a local MEEP installation (deselected by default; run with `pytest -m meep_local`)",
]
norecursedirs = ["scripts"]
testpaths = ["tests"]

[tool.ruff]
fix = true
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]  # see https://docs.astral.sh/ruff/rules
ignore = [
  "ANN",  # flake8-annotations (too noisy for evolving API)
  "BLE001",  # blind exception (common around optional deps / wrappers)
  "C408",  # unnecessary-collection-call
  "C901",  # complex-structure
  "COM812",  # missing-trailing-comma
  "D417",  # undocumented-param (google convention is strict here)
  "D105",  # undocumented-magic-method
  "EM101",  # exception-must-not-use-string-literal
  "EM102",  # exception-must-not-use-f-string-literal
  "E741",  # ambiguous-variable-name
  "ERA001",  # commented-out-code
  "FBT",  # boolean-trap (fine for public API, use keywords in docs/examples)
  "FIX001",  # line-contains-fixme
  "FIX002",  # line-contains-todo
  "FIX004",  # line-contains-hack
  "N803",  # invalid-argument-name
  "N806",  # non-lowercase-variable-in-function
  "PLC0414",  # useless-import-alias
  "PLR",  # pylint refactor (too strict for this codebase right now)
  "PLR0913",  # too-many-arguments
  "PLR2004",  # magic-value-comparison
  "PLW2901",  # redefined-loop-name
  "PTH123",  # Path.open preferred
  "S110",  # try-except-pass
  "S112",  # try-except-continue (best-effort gmsh tag queries)
  "RET504",  # unnecessary-assign
  "S324",  # hashlib-insecure-hash-function
  "TC001",  # typing-only-first-party-import
  "TC002",  # typing-only-third-party-import
  "TC003",  # typing-only-standard-library-import
  "PLC0415",  # import-outside-top-level (needed for lazy imports to avoid circular deps)
  "TC006",  # runtime-cast-value
  "TD001",  # invalid-todo-tag
  "TD002",  # missing-todo-author
  "TD003",  # missing-todo-link
  "TID252",  # relative-imports
  "TRY003",  # raise-vanilla-args
]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = [
  "ANN",  # flake8-annotations
  "ARG001",  # unused-function-argument
  "D",  # pydocstyle
  "E402",  # module-import-not-at-top-of-file
  "E501",  # line-too-long
  "F821",  # undefined-name
  "FBT003",  # boolean-positional-value-in-call
  "N816",  # mixed-case-variable-in-global-scope
  "NPY",  # numpy (allow legacy RNG calls in notebooks)
  "PLC2401",  # non-ascii-name
  "S101",  # assert
  "SLF001",  # private-member-access
  "T201",  # print
]
"scripts/*.py" = [
  "ANN",  # flake8-annotations
  "ARG001",  # unused-function-argument
  "D",  # pydocstyle
  "E402",  # module-import-not-at-top-of-file
  "E501",  # line-too-long
  "F821",  # undefined-name
  "FBT003",  # boolean-positional-value-in-call
  "INP001",  # implicit-namespace-package
  "N816",  # mixed-case-variable-in-global-scope
  "PLC2401",  # non-ascii-name
  "S101",  # assert
  "SLF001",  # private-member-access
  "T201",  # print
]
"tests/**/*.py" = [
  "ANN",  # flake8-annotations
  "D",  # pydocstyle
  "INP001",  # implicit-namespace-package
  "PLC0415",  # allow imports inside tests
  "PT011",  # pytest-raises-too-broad
  "S101",  # assert
  "SLF001",  # private-member-access (testing internal state)
  "T201",  # print
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.setuptools.package-data]
"gsim.fdtd" = ["assets/*.html"]

[tool.setuptools.packages.find]
where = ["src"]

[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
possibly-missing-attribute = "ignore"
invalid-argument-type = "ignore"

[tool.ty.rules]
missing-argument = "ignore"
possibly-missing-attribute = "ignore"
# Suppress rules that generate many false-positives in this codebase
# (optional deps, third-party stubs, matplotlib Axes|None, etc.)
unused-ignore-comment = "ignore"
# Optional runtime dependencies that are not always installed locally
unresolved-import = "ignore"

[tool.ty.src]
include = ["src"]
