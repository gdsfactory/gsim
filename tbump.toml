[version]
current = "0.5.0"
regex = '''
  (?P<major>\d+)
  \.
  (?P<minor>\d+)
  \.
  (?P<patch>\d+)
  '''

[git]
message_template = "Release {new_version}"
tag_template = "{new_version}"

[[file]]
src = "pyproject.toml"
search = 'version = "{current_version}"'

[[file]]
src = "README.md"
search = "# gsim {current_version}"

[[file]]
src = "src/gsim/__init__.py"
search = '__version__ = "{current_version}"'
